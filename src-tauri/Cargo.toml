[package]
name = "luavault"
version = "1.0.1"
description = "Local library companion for Steam and SteamTools"
authors = ["kilian"]
edition = "2021"
default-run = "luavault"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luavault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The asset-protocol feature serves local files to the webview (artwork
# cache, LOT-14). tauri-build checks this feature list against
# tauri.conf.json's assetProtocol.enable — the two must move together.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "gzip",
  "brotli",
  "zstd",
  "rustls-tls",
] }
tokio = { version = "1", features = ["macros", "sync", "time", "fs", "io-util", "rt-multi-thread", "net"] }
winreg = "0.55"
rand = "0.9"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
urlencoding = "2"
unrar = "0.5"
sha2 = "0.10"
ed25519-dalek = "2"
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto", "bzip2", "lzma", "zstd", "deflate64"] }

# LOT-21 — encrypted backup
aes-gcm = { version = "0.10", features = ["stream", "alloc"] }
argon2 = "0.5"
zeroize = "1"
# HMAC for index.json integrity guard
hmac = "0.12"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
