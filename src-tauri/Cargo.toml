[package]
name = "luavault"
version = "1.3.3-exp.1"
description = "Local library companion for Steam and SteamTools"
authors = ["kilian"]
edition = "2021"
default-run = "luavault"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luavault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The experimental edition. Alone, it takes the stable's place (same identity, same data):
# what a stable switching to the experimental channel installs over itself.
experimental = []
# The experimental edition installed beside the stable: its own data folder and registrations
# (with `src-tauri/tauri.exp.conf.json` for its own name and identifier).
beside = ["experimental"]
# The release signer (`lvrelease`), for the publication scripts only: off by default so that
# `tauri build` neither builds nor ships it in the installer.
release-tools = []

[[bin]]
name = "lvrelease"
path = "src/bin/lvrelease.rs"
required-features = ["release-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The asset-protocol feature serves local files to the webview (artwork
# cache, LOT-14). tauri-build checks this feature list against
# tauri.conf.json's assetProtocol.enable — the two must move together.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# One resident process: a second launch shows the first one (release builds only, see lib.rs).
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "gzip",
  "brotli",
  "zstd",
  "rustls-tls",
] }
tokio = { version = "1", features = ["macros", "sync", "time", "fs", "io-util", "rt-multi-thread", "net"] }
winreg = "0.56"
rand = "0.10"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# LuaVault in Steam (experimental): the Steam client's debugging protocol, on the loopback only (ws://, no TLS).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
urlencoding = "2"
unrar = "0.5"
sha2 = "0.11"
# Wayback stores some captures gzipped and serves them so whatever the request
# says; `steam_downgrade` inflates by hand, under a cap (`gunzip_capped`).
flate2 = "1"
ed25519-dalek = "2"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto", "bzip2", "lzma", "zstd", "deflate64"] }

# LOT-21 — encrypted backup
aes-gcm = { version = "0.10", features = ["stream", "alloc"] }
argon2 = "0.5"
zeroize = "1"
# HMAC for index.json integrity guard
hmac = "0.13"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_Shell",
  # SHELLEXECUTEINFOW carries an HKEY; another crate used to switch this feature on for us.
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_Threading",
  # Toast notifications of the message of the day (`notify.rs`).
  "Win32_System_WinRT",
  "UI_Notifications",
  "Data_Xml_Dom",
  "Foundation",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
